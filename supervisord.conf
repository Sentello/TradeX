[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

# One worker per service: the dashboard's login lockout counter lives in
# process memory, and multiple workers would race on the rotating log files.
[program:dashboard_app]
command=gunicorn -w 1 -b 0.0.0.0:5000 dashboard_app:app
directory=/app
environment=TRADEX_SERVICE="dashboard"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dashboard_app.err.log
stdout_logfile=/var/log/supervisor/dashboard_app.out.log
startsecs=5
stopwaitsecs=10
priority=10

[program:webhook_app]
command=gunicorn -w 1 -b 0.0.0.0:5005 webhook_receiver:app
directory=/app
environment=TRADEX_SERVICE="webhook"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/webhook_app.err.log
stdout_logfile=/var/log/supervisor/webhook_app.out.log
startsecs=5
stopwaitsecs=10
priority=20

# Exits 0 immediately when MODE excludes email; autorestart=unexpected keeps
# supervisor from respawning it in that case.
[program:email_reader]
command=python email_reader.py
directory=/app
environment=TRADEX_SERVICE="email_reader"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=15
priority=30

[group:tradex]
programs=dashboard_app,webhook_app,email_reader
priority=999
