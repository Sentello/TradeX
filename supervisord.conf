[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

# Launched via serve.py so DASHBOARD_HOST/PORT and WEBHOOK_HOST/PORT from
# .env are honoured. Hardcoding the bind address here made those documented
# settings do nothing. serve.py also pins workers to 1: the PIN and login
# lockouts live in process memory, so a second worker would hand an attacker
# two independent allowances.
[program:dashboard_app]
command=python serve.py dashboard
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dashboard_app.err.log
stdout_logfile=/var/log/supervisor/dashboard_app.out.log
startsecs=5
stopwaitsecs=10
priority=10

[program:webhook_app]
command=python serve.py webhook
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/webhook_app.err.log
stdout_logfile=/var/log/supervisor/webhook_app.out.log
startsecs=5
stopwaitsecs=10
priority=20

# Exits 0 immediately when MODE excludes email; autorestart=unexpected keeps
# supervisor from respawning it in that case.
[program:email_reader]
command=python email_reader.py
directory=/app
environment=TRADEX_SERVICE="email_reader"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopwaitsecs=15
priority=30

[group:tradex]
programs=dashboard_app,webhook_app,email_reader
priority=999
